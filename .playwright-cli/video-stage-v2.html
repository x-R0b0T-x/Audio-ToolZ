<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Audio ToolZ — Techno Showcase Engine v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #060711;
    font-family: 'Plus Jakarta Sans', 'Noto Sans', 'Liberation Sans', sans-serif;
    color: #f8f8f2;
    user-select: none;
  }

  #stage {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #101122 0%, #070812 68%, #04050a 100%);
    perspective: 1400px;
  }

  /* Green & Purple Atmospheric Halos matching Audio ToolZ theme */
  .halo {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(80px);
    z-index: 0;
    will-change: transform, opacity;
  }

  #halo-purple-left {
    width: 680px;
    height: 540px;
    left: -140px;
    top: -110px;
    background: radial-gradient(circle, rgba(189, 147, 249, 0.42) 0%, rgba(124, 58, 237, 0.18) 45%, transparent 72%);
  }

  #halo-green-right {
    width: 700px;
    height: 560px;
    right: -130px;
    bottom: -140px;
    background: radial-gradient(circle, rgba(69, 248, 130, 0.36) 0%, rgba(16, 185, 129, 0.14) 48%, transparent 74%);
  }

  #halo-purple-bottom {
    width: 580px;
    height: 420px;
    left: 160px;
    bottom: -160px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(139, 92, 246, 0.10) 55%, transparent 76%);
  }

  #halo-green-top {
    width: 560px;
    height: 400px;
    right: 120px;
    top: -140px;
    background: radial-gradient(circle, rgba(69, 248, 130, 0.25) 0%, rgba(52, 211, 153, 0.08) 55%, transparent 76%);
  }

  #halo-center-pulse {
    width: 780px;
    height: 420px;
    left: 250px;
    top: 150px;
    background: radial-gradient(ellipse, rgba(189, 147, 249, 0.18) 0%, rgba(69, 248, 130, 0.14) 48%, transparent 74%);
  }

  #grid-canvas {
    position: absolute;
    inset: 0;
    width: 1280px;
    height: 720px;
    z-index: 1;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 44%, transparent 50%, rgba(4, 5, 12, 0.68) 100%);
  }

  #caption-scrim {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 132px;
    z-index: 45;
    pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(6, 7, 16, 0.78) 54%, rgba(6, 7, 16, 0.94) 100%);
    opacity: 0;
  }

  /* Brand Intro & Outro Layer */
  #brand-scene {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }

  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 24px;
    position: relative;
  }

  .brand-badge {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    background: #14161e;
    border: 2px solid rgba(189, 147, 249, 0.72);

    padding: 6px;

    width: 100%;
    height: 100%;
    border-radius: 18px;
    display: block;
  }

  .brand-badge-flash {
    position: absolute;

    background: #ffffff;
    border-radius: 24px;

  .brand-wordmark {

  #ui-world {

    inset: 0;
    z-index: 10;

    opacity: 0;

  .win-frame img {

  #ui-playhead {
    position: absolute;

    opacity: 0;

  #ui-focus-box {
    position: absolute;
    border-radius: 7px;
    border: 2px solid #45f882;

  #ui-focus-box-2 {
    position: absolute;

    box-shadow: 0 0 20px rgba(139, 233, 253, 0.55), inset 0 0 10px rgba(139, 233, 253, 0.15);
    z-index: 6;

  /* Pixel-locked Virtual Cursor & Ripples inside #main-win coords */
  #ui-cursor {
    position: absolute;
    z-index: 25;
    width: 24px;
    height: 24px;
    pointer-events: none;
    opacity: 0;
    transform-origin: 2px 2px;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.9));

  #ui-ripple {
    position: absolute;
    z-index: 23;

    height: 46px;
    margin-left: -23px;
    margin-top: -23px;

    opacity: 0;

  #ui-pill {
    position: absolute;
    z-index: 24;

    color: #0b0d14;

    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    opacity: 0;
    white-space: nowrap;
  }

  /* Clean Non-Intersecting 3D Fan Cards (Scene 6) */
  .fan-card {
    position: absolute;
    width: 448px;
    height: 280px;
    border-radius: 10px;
    overflow: hidden;
    border: 1.5px solid rgba(255, 255, 255, 0.24);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.9), 0 0 36px rgba(189, 147, 249, 0.18);
    opacity: 0;
    z-index: 12;
  }
  .fan-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  /* Bottom-Left Gridline Minimalist Caption System */
  #caption-wrap {
    position: absolute;
    left: 42px;
    bottom: 24px;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
  }

  .cap-kicker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 700;
    color: #b4bed4;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }

  .cap-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: rgba(189, 147, 249, 0.22);
    border: 1px solid rgba(189, 147, 249, 0.45);
    color: #45f882;
    font-size: 11px;
  }

  .cap-line {
    font-size: 19px;
    font-weight: 600;
    color: #f8f8f2;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.98);
  }
</style>

<script>
const S = "http://127.0.0.1:3001/.playwright-cli/shots-v2/";
const SHOTS = {
  loaded: S + "v2-1-loaded.png",
  bpm: S + "v2-2-bpm.png",
  zoomGrid: S + "v2-3-zoom-grid.png",
  leftKick: S + "v2-4-left-kick12.png",
  loop4: S + "v2-5-loop-4beats.png",
  zoomSel: S + "v2-6-zoom-selection.png",
  zoomAttack: S + "v2-7-zoom-attack.png",
  effects: S + "v2-8-effects.png",
  export: S + "v2-9-export.png",
  live: Array.from({ length: 12 }, (_, i) => `${S}v2-live-${String(i).padStart(2, "0")}.png`),
  osc: Array.from({ length: 6 }, (_, i) => `${S}v2-osc-${String(i).padStart(2, "0")}.png`)
};

// Preload all frames cleanly
const preloadBox = document.createElement("div");
preloadBox.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;";
document.body.appendChild(preloadBox);
for (const s of [SHOTS.loaded, SHOTS.bpm, SHOTS.zoomGrid, SHOTS.leftKick, SHOTS.loop4, SHOTS.zoomSel, SHOTS.zoomAttack, SHOTS.effects, SHOTS.export, ...SHOTS.live, ...SHOTS.osc]) {
  const im = new Image();
  im.src = s;
  preloadBox.appendChild(im);
}

// Exact beat-locked timestamps from build-v2-audio.mjs (130.8 BPM)
const BEAT = 1.8354 / 4; // 0.45885s
const BAR = 1.8354;
const T_S2 = 5.5315;
const T_S3 = 14.7071;
const T_S4A = 22.0457;
const T_S4B = 27.5498; // Exact start of isolated 4-beat loop!
const T_S4C = 31.2206; // +2 bars inside 4-beat loop
const T_S5 = 36.7267;
const T_S6 = 44.0654;
const T_OUTRO = 51.4041;

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function lerp(a, b, t) { return a + (b - a) * clamp01(t); }
function easeOutCubic(t) { t = clamp01(t); return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function norm(t, a, b) { return clamp01((t - a) / (b - a)); }

const haloPL = document.getElementById("halo-purple-left");
const haloGR = document.getElementById("halo-green-right");
const haloPB = document.getElementById("halo-purple-bottom");
const haloGT = document.getElementById("halo-green-top");
const haloCP = document.getElementById("halo-center-pulse");

function animateHalos(t) {
  const fadeOut = t > 56.5 ? clamp01((59.6 - t) / 3.1) : 1.0;
  const fadeIn = clamp01(t / 1.4);
  const beatPhase = (t % BEAT) / BEAT;
  const kickPulse = (t >= 1.85 && t < 53.5) ? Math.exp(-beatPhase * 5.0) * 0.28 : 0;

  const driftX = Math.sin(t * 0.35) * 42;
  const driftY = Math.cos(t * 0.28) * 30;

  haloPL.style.opacity = (0.72 + kickPulse * 0.65) * fadeIn * fadeOut;
  haloPL.style.transform = `translate(${driftX}px, ${driftY}px) scale(${1 + kickPulse * 0.16})`;

  haloGR.style.opacity = (0.70 + kickPulse * 0.65) * fadeIn * fadeOut;
  haloGR.style.transform = `translate(${-driftX}px, ${-driftY}px) scale(${1 + kickPulse * 0.16})`;

  haloPB.style.opacity = (0.55 + kickPulse * 0.45) * fadeIn * fadeOut;
  haloPB.style.transform = `translate(${-driftX * 0.6}px, ${driftY * 0.5}px)`;

  haloGT.style.opacity = (0.55 + kickPulse * 0.45) * fadeIn * fadeOut;
  haloGT.style.transform = `translate(${driftX * 0.6}px, ${-driftY * 0.5}px)`;

  haloCP.style.opacity = (0.45 + kickPulse * 0.95) * fadeIn * fadeOut;
  haloCP.style.transform = `scale(${0.96 + kickPulse * 0.22})`;
}

const canvas = document.getElementById("grid-canvas");
const ctx = canvas.getContext("2d");

function drawPerspectiveGrid(t) {
  ctx.clearRect(0, 0, 1280, 720);
  const fadeOut = t > 56.5 ? clamp01((59.6 - t) / 3.1) : 1.0;
  if (fadeOut <= 0.001) return;

  const horizonY = 395;
  const vanishX = 640;
  const bottomY = 720;

  const beatPhase = (t % BEAT) / BEAT;
  const beatPulse = t >= 1.85 && t < 53.5 ? Math.exp(-beatPhase * 5.2) * 0.18 : 0;
  const speed = t < T_S2 ? 0.42 : 0.78;
  const zScroll = (t * speed) % 1;

  // Horizon green-to-purple neon strip glow
  const hGlow = ctx.createLinearGradient(0, horizonY - 35, 1280, horizonY + 35);
  hGlow.addColorStop(0, "rgba(189, 147, 249, 0)");
  hGlow.addColorStop(0.28, `rgba(189, 147, 249, ${(0.09 + beatPulse * 0.14) * fadeOut})`);
  hGlow.addColorStop(0.5, `rgba(69, 248, 130, ${(0.14 + beatPulse * 0.2) * fadeOut})`);
  hGlow.addColorStop(0.72, `rgba(189, 147, 249, ${(0.09 + beatPulse * 0.14) * fadeOut})`);
  hGlow.addColorStop(1, "rgba(69, 248, 130, 0)");
  ctx.fillStyle = hGlow;
  ctx.fillRect(0, horizonY - 40, 1280, 90);

  const numH = 14;
  for (let i = 0; i < numH; i++) {
    const reveal = t < 2.6 ? clamp01((t - i * 0.12) / 0.42) : 1.0;
    if (reveal <= 0) continue;

    const u = (i + zScroll) / numH;
    const persp = Math.pow(u, 2.15);
    const y = horizonY + persp * (bottomY - horizonY);
    if (y > bottomY) continue;

    const alpha = (0.05 + persp * 0.26 + beatPulse * persp * 0.42) * reveal * fadeOut;
    const widthFactor = t < 2.2 ? easeOutCubic(reveal) : 1;
    const halfSpan = 900 * widthFactor;

    ctx.beginPath();
    ctx.moveTo(vanishX - halfSpan, y);
    ctx.lineTo(vanishX + halfSpan, y);
    ctx.strokeStyle = i % 4 === 0
      ? `rgba(69, 248, 130, ${alpha * 0.85})`
      : i % 2 === 0
        ? `rgba(189, 147, 249, ${alpha * 0.65})`
        : `rgba(180, 195, 225, ${alpha * 0.7})`;
    ctx.lineWidth = i % 4 === 0 ? 1.4 : 1.0;
    ctx.stroke();
  }

  const numV = 18;
  for (let k = -numV / 2; k <= numV / 2; k++) {
    const absK = Math.abs(k);
    const reveal = t < 2.6 ? clamp01((t - absK * 0.18) / 0.5) : 1.0;
    if (reveal <= 0) continue;

    const xBottom = vanishX + k * 145;
    const xTop = vanishX + k * 18;
    const progress = easeOutCubic(reveal);
    const curX = lerp(xTop, xBottom, progress);
    const curY = lerp(horizonY, bottomY, progress);

    const distFade = clamp01(1 - absK / (numV * 0.62));
    const isAccent = k === 0 || Math.abs(k) === 3 || Math.abs(k) === 6;
    const alpha = (isAccent ? 0.34 : 0.16 + beatPulse * 0.28) * distFade * fadeOut;

    const grad = ctx.createLinearGradient(xTop, horizonY, xBottom, bottomY);
    if (k < 0) {
      grad.addColorStop(0, "rgba(189, 147, 249, 0)");
      grad.addColorStop(0.35, `rgba(189, 147, 249, ${alpha * 0.95})`);
      grad.addColorStop(1, `rgba(189, 147, 249, ${alpha * 1.3})`);
    } else if (k > 0) {
      grad.addColorStop(0, "rgba(69, 248, 130, 0)");
      grad.addColorStop(0.35, `rgba(69, 248, 130, ${alpha * 0.95})`);
      grad.addColorStop(1, `rgba(69, 248, 130, ${alpha * 1.3})`);
    } else {
      grad.addColorStop(0, "rgba(69, 248, 130, 0)");
      grad.addColorStop(0.35, `rgba(69, 248, 130, ${alpha})`);
      grad.addColorStop(1, `rgba(189, 147, 249, ${alpha * 1.35})`);
    }

    ctx.beginPath();
    ctx.moveTo(xTop, horizonY);
    ctx.lineTo(curX, curY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = isAccent ? 1.5 : 1.0;
    ctx.stroke();
  }
}

const brandScene = document.getElementById("brand-scene");
const brandBadge = document.getElementById("brand-badge");
const brandFlash = document.getElementById("brand-flash");
const brandWordmark = document.getElementById("brand-wordmark");
const brandTagline = document.getElementById("brand-tagline");
const brandOutroMeta = document.getElementById("brand-outro-meta");

const mainWin = document.getElementById("main-win");
const mainImg = document.getElementById("main-img");
const uiPlayhead = document.getElementById("ui-playhead");
const uiFocusBox = document.getElementById("ui-focus-box");
const uiFocusBox2 = document.getElementById("ui-focus-box-2");
const uiCursor = document.getElementById("ui-cursor");
const uiRipple = document.getElementById("ui-ripple");
const uiPill = document.getElementById("ui-pill");

const fanCards = [
  document.getElementById("fan-1"),
  document.getElementById("fan-2"),
  document.getElementById("fan-3"),
  document.getElementById("fan-4"),
];

const capScrim = document.getElementById("caption-scrim");
const capWrap = document.getElementById("caption-wrap");
const capKey = document.getElementById("cap-key");
const capTitle = document.getElementById("cap-title");
const capText = document.getElementById("cap-text");

function setCaption(visible, key, title, text) {
  capWrap.style.opacity = visible ? 1 : 0;
  capScrim.style.opacity = visible ? 1 : 0;
  if (visible) {
    capKey.textContent = key;
    capTitle.textContent = title;
    capText.textContent = text;
  }
}

function setUICursor(ux, uy, opacity, clickAt = -1, t = 0, label = "", pillColor = "#8be9fd") {
  uiCursor.style.opacity = opacity;
  uiCursor.style.left = ux + "px";
  uiCursor.style.top = uy + "px";
  if (clickAt >= 0 && t >= clickAt && t < clickAt + 0.75) {
    const p = (t - clickAt) / 0.75;
    const sc = p < 0.2 ? 0.80 : 1.0;
    uiCursor.style.transform = `scale(${sc})`;
    uiRipple.style.opacity = clamp01(1 - p);
    uiRipple.style.left = ux + "px";
    uiRipple.style.top = uy + "px";
    uiRipple.style.borderColor = pillColor;
    uiRipple.style.transform = `scale(${0.4 + p * 1.4})`;
    if (label) {
      uiPill.textContent = label;
      uiPill.style.background = pillColor;
      uiPill.style.opacity = p < 0.82 ? 1 : clamp01((1 - p) * 5.5);
      uiPill.style.left = (ux + 16) + "px";
      uiPill.style.top = (uy - 12) + "px";
    } else {
      uiPill.style.opacity = 0;
    }
  } else {
    uiCursor.style.transform = "scale(1)";
    uiRipple.style.opacity = 0;
    uiPill.style.opacity = 0;
  }
}

let lastSrc = "";
function setMainShot(src) {
  if (lastSrc !== src) {
    mainImg.src = src;
    lastSrc = src;
  }
}

window.renderFrame = function(t) {
  animateHalos(t);
  drawPerspectiveGrid(t);
  uiPlayhead.style.opacity = 0;
  uiFocusBox.style.opacity = 0;
  uiFocusBox2.style.opacity = 0;
  for (const fc of fanCards) fc.style.opacity = 0;
  setUICursor(0, 0, 0);

  // ==============================================================
  // SCENE 1 (0.000s - 5.532s): INTRO HALOS + LOGO AUDIO TOOLZ
  // ==============================================================
  if (t < T_S2) {
    mainWin.style.opacity = 0;
    setCaption(false);

    if (t < 1.85) {
      brandScene.style.opacity = 0;
    } else {
      const inB = easeOutCubic(norm(t, 1.85, 2.55));
      const wordIn = easeOutCubic(norm(t, 2.55, 3.25));
      const tagIn = easeOutCubic(norm(t, 3.20, 3.85));
      const exitOut = t > 4.95 ? 1 - easeInOutCubic(norm(t, 4.95, T_S2)) : 1;

      brandScene.style.opacity = exitOut;
      brandScene.style.transform = `scale(${lerp(0.92, 1.0, inB) * lerp(1.06, 1.0, 1 - exitOut)}) translateY(${lerp(24, 0, inB)}px)`;

      brandFlash.style.opacity = t < 2.30 ? clamp01(1 - (t - 1.85) / 0.45) : 0;
      brandBadge.style.transform = `translateX(${lerp(175, 0, wordIn)}px) scale(${lerp(0.65, 1.0, inB)})`;

      brandWordmark.style.clipPath = `inset(0 ${(1 - wordIn) * 100}% 0 0)`;
      brandWordmark.style.opacity = wordIn;
      brandTagline.textContent = "Détection BPM · Boucles de 4 temps · Kicks aimantés";
      brandTagline.style.opacity = tagIn;
      brandTagline.style.transform = `translateY(${lerp(12, 0, tagIn)}px)`;
      brandOutroMeta.style.opacity = 0;
    }
    return;
  }

  // ==============================================================
  // SCENE 2 (5.532s - 14.707s): A · CHARGEMENT TECHNO & INTERFACE
  // ==============================================================
  if (t < T_S3) {
    brandScene.style.opacity = 0;
    const enter = easeOutCubic(norm(t, T_S2, T_S2 + 1.15));
    const exitP = t > T_S3 - 0.5 ? easeInOutCubic(norm(t, T_S3 - 0.5, T_S3)) : 0;

    setMainShot(SHOTS.loaded);

    const rotX = lerp(32, 2.5, enter) - Math.sin(t * 0.7) * 1.1;
    const rotY = lerp(-8, Math.sin(t * 0.55) * 3.8, enter) + exitP * -10;
    const ty = lerp(220, -10, enter) + exitP * -16;
    const sc = lerp(0.78, 0.94, enter);

    mainWin.style.opacity = enter * (1 - exitP * 0.12);
    mainWin.style.transform = `translateY(${ty}px) scale(${sc}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    // Playhead sweeps over the active 0..31s waveform portion
    const pWave = ((t - T_S2) / (T_S3 - T_S2)) * 0.68;
    uiPlayhead.style.opacity = enter * 0.9;
    uiPlayhead.style.left = lerp(36, 665, pWave) + "px";

    setCaption(
      true,
      "A",
      "Interface minimaliste",
      t < 10.1
        ? "Votre morceau Techno est chargé en stéréo G / D dans Audio ToolZ."
        : "Forme d'onde violette & verte haute lisibilité, zéro encombrement."
    );
    return;
  }

  // ==============================================================
  // SCENE 3 (14.707s - 22.046s): B · CLIC SUR DÉTECTEUR DE BPM
  // ==============================================================
  if (t < T_S4A) {
    brandScene.style.opacity = 0;
    const clickAt = 16.85;
    const clicked = t >= clickAt;
    setMainShot(clicked ? SHOTS.bpm : SHOTS.loaded);

    const p1 = easeInOutCubic(norm(t, T_S3, T_S3 + 1.45));
    const p2 = easeInOutCubic(norm(t, 18.6, 20.3));

    let sc = lerp(0.94, 1.56, p1);
    let tx = lerp(0, 42, p1);
    let ty = lerp(-10, 215, p1);
    let rotX = lerp(2, 4, p1);
    let rotY = lerp(2, -3, p1);

    if (t >= 18.6) {
      sc = lerp(1.56, 1.44, p2);
      tx = lerp(42, 72, p2);
      ty = lerp(215, -215, p2);
      rotX = lerp(4, -2, p2);
      rotY = lerp(-3, 4, p2);
    }

    mainWin.style.opacity = 1;
    mainWin.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${sc}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    // Highlight box right on the BPM Detector button (456, 36) -> then down to status bar "130.8 BPM · Aimant kicks actif"
    if (t >= 15.6 && t < 18.6) {
      uiFocusBox.style.opacity = clamp01((t - 15.6) * 4);
      uiFocusBox.style.borderColor = clicked ? "#45f882" : "#bd93f9";
      uiFocusBox.style.left = "456px";
      uiFocusBox.style.top = "36px";
      uiFocusBox.style.width = "28px";
      uiFocusBox.style.height = "28px";
    } else if (t >= 19.6) {
      uiFocusBox.style.opacity = clamp01((t - 19.6) * 3.5);
      uiFocusBox.style.borderColor = "#45f882";
      uiFocusBox.style.left = "284px";
      uiFocusBox.style.top = "574px";
      uiFocusBox.style.width = "184px";
      uiFocusBox.style.height = "24px";
    }

    if (t < 18.6) {
      const m = easeInOutCubic(norm(t, T_S3 + 0.3, clickAt - 0.15));
      setUICursor(lerp(340, 470, m), lerp(165, 50, m), norm(t, T_S3 + 0.1, T_S3 + 0.5), clickAt, t, "Clic · Détecteur BPM", "#bd93f9");
    }

    setCaption(
      true,
      "B",
      "Détection des BPM par kick",
      clicked
        ? "130.8 BPM · 99 kicks repérés — les points de kicks sont maintenant aimantés."
        : "Cliquez sur le détecteur de BPM pour analyser automatiquement les kicks."
    );
    return;
  }

  // ==============================================================
  // SCENE 4A (22.046s - 27.550s): C · CRÉER UNE BOUCLE DE 4 TEMPS (KICKS AIMANTÉS)
  // ==============================================================
  if (t < T_S4B) {
    brandScene.style.opacity = 0;
    const tLeftClick = 23.60;
    const tRightClick = 25.65;

    if (t < tLeftClick) {
      setMainShot(SHOTS.zoomGrid);
    } else if (t < tRightClick) {
      setMainShot(SHOTS.leftKick);
    } else {
      setMainShot(SHOTS.loop4);
    }

    const trans = easeInOutCubic(norm(t, T_S4A, T_S4A + 0.95));
    const sc = lerp(1.44, 0.96, trans);
    const tx = lerp(72, 0, trans);
    const ty = lerp(-215, -10, trans);

    mainWin.style.opacity = 1;
    mainWin.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${sc}) rotateX(2deg) rotateY(${Math.sin(t * 0.65) * 2.5}deg)`;

    // Exact kick 12 (355px) and kick 13 (640px) inside 960x600 #main-win
    if (t < tLeftClick + 0.75) {
      const m = easeInOutCubic(norm(t, T_S4A + 0.35, tLeftClick - 0.12));
      setUICursor(lerp(240, 355, m), lerp(180, 145, m), 1, tLeftClick, t, "Clic gauche · Kick 12 aimanté", "#8be9fd");
    } else {
      const m = easeInOutCubic(norm(t, tLeftClick + 0.75, tRightClick - 0.15));
      setUICursor(lerp(355, 640, m), 145, 1, tRightClick, t, "Clic droit · Kick 13 (4 temps)", "#45f882");
    }

    if (t >= tLeftClick && t < tRightClick) {
      uiFocusBox.style.opacity = 0.95;
      uiFocusBox.style.borderColor = "#8be9fd";
      uiFocusBox.style.left = "348px";
      uiFocusBox.style.top = "86px";
      uiFocusBox.style.width = "14px";
      uiFocusBox.style.height = "446px";
    } else if (t >= tRightClick) {
      uiFocusBox.style.opacity = 1;
      uiFocusBox.style.borderColor = "#45f882";
      uiFocusBox.style.left = "355px";
      uiFocusBox.style.top = "86px";
      uiFocusBox.style.width = "285px";
      uiFocusBox.style.height = "446px";
    }

    setCaption(
      true,
      "C",
      "Boucle de 4 temps · Kicks aimantés",
      t >= tRightClick
        ? "Boucle de 4 temps (00:01.835) verrouillée sur les points de kicks aimantés."
        : "Clic gauche pour le départ, clic droit 4 temps plus loin : l'aimant cale les kicks."
    );
    return;
  }

  // ==============================================================
  // SCENE 4B (27.550s - 36.727s): C · GROS ZOOM ATTAQUE DU KICK + BOUCLE 4 TEMPS RÉELLE
  // ==============================================================
  if (t < T_S5) {
    brandScene.style.opacity = 0;

    if (t < T_S4C) {
      // 27.550s - 31.221s (2 bars): Ultra-close zoom on Kick 12 Attack (v2-7-zoom-attack.png)
      setMainShot(SHOTS.zoomAttack);
      const zIn = easeOutCubic(norm(t, T_S4B, T_S4B + 0.85));
      const sc = lerp(1.02, 1.38, zIn);
      const tx = lerp(12, 110, zIn); // Center kick 12 (~355px) right in stage view!
      const ty = lerp(-10, 6, zIn);
      const rotY = lerp(-4, 3, clamp01((t - T_S4B) / 3.6));

      mainWin.style.opacity = 1;
      mainWin.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${sc}) rotateX(2.5deg) rotateY(${rotY}deg)`;

      // Highlight the exact vertical kick 12 attack line in v2-7-zoom-attack.png (355px)
      uiFocusBox.style.opacity = 0.95;
      uiFocusBox.style.borderColor = "#45f882";
      uiFocusBox.style.left = "343px";
      uiFocusBox.style.top = "86px";
      uiFocusBox.style.width = "22px";
      uiFocusBox.style.height = "446px";

      setCaption(
        true,
        "C",
        "Calage pile à l'attaque du kick",
        "Zoom serré sur le repère 12 : la boucle démarre à la milliseconde de l'attaque."
      );
    } else {
      // 31.221s - 36.727s (3 bars): Full 4-beat loop playing seamlessly in sync with soundtrack!
      const loopPhase = ((t - T_S4B) % BAR) / BAR; // Locked to exact 1.8354s 4-beat bar!
      const liveIdx = Math.floor(loopPhase * SHOTS.live.length) % SHOTS.live.length;
      setMainShot(SHOTS.live[liveIdx]);

      const zIn = easeOutCubic(norm(t, T_S4C, T_S4C + 0.65));
      const sc = lerp(1.22, 1.04, zIn);
      const rotY = lerp(5, -4, clamp01((t - T_S4C) / 5.4));

      mainWin.style.opacity = 1;
      mainWin.style.transform = `translate3d(0px, -10px, 0) scale(${sc}) rotateX(2.5deg) rotateY(${rotY}deg)`;

      // Synced playhead sweeping across the 4 kicks inside the full zoomed 4-beat loop!
      uiPlayhead.style.opacity = 0.95;
      uiPlayhead.style.left = lerp(35, 956, loopPhase) + "px";

      setCaption(
        true,
        "C",
        "Boucle de 4 temps en lecture",
        "Les 4 kicks tournent en boucle continue à 130.8 BPM sans aucun décalage."
      );
    }
    return;
  }

  // ==============================================================
  // SCENE 5 (36.727s - 44.065s): D · CONTRÔLE & ANALYSEUR TEMPS RÉEL (SPECTRE + OSCILLO)
  // ==============================================================
  if (t < T_S6) {
    brandScene.style.opacity = 0;
    const zoomControl = easeInOutCubic(norm(t, T_S5, T_S5 + 1.15));

    if (t < 40.4) {
      const idx = Math.floor((t - T_S5) * 10) % SHOTS.live.length;
      setMainShot(SHOTS.live[idx]);
    } else {
      const idx = Math.floor((t - 40.4) * 9) % SHOTS.osc.length;
      setMainShot(SHOTS.osc[idx]);
    }

    const sc = lerp(1.02, 1.66, zoomControl);
    const tx = lerp(0, -250, zoomControl);
    const ty = lerp(-10, -22, zoomControl);
    const rotY = lerp(0, -5, zoomControl) + Math.sin(t * 0.85) * 1.4;

    mainWin.style.opacity = 1;
    mainWin.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${sc}) rotateX(3deg) rotateY(${rotY}deg)`;

    uiFocusBox.style.opacity = zoomControl;
    uiFocusBox.style.borderColor = t < 40.4 ? "#bd93f9" : "#45f882";
    uiFocusBox.style.left = "574px";
    uiFocusBox.style.top = "174px";
    uiFocusBox.style.width = "270px";
    uiFocusBox.style.height = "248px";

    setCaption(
      true,
      "D",
      "Contrôle & Analyseur temps réel",
      t < 40.4
        ? "Lecture en boucle, VU-mètres G / D, volume, vitesse et spectre fréquentiel."
        : "Bascule instantanée vers l'oscilloscope stéréo G / D haute fluidité."
    );
    return;
  }

  // ==============================================================
  // SCENE 6 (44.065s - 51.404s): E · EFFETS & EXPORT STUDIO (SPLIT + 2x2 WALL)
  // ==============================================================
  if (t < T_OUTRO) {
    brandScene.style.opacity = 0;
    mainWin.style.opacity = 0;

    if (t < T_S6 + BAR * 2) {
      const enter = easeOutCubic(norm(t, T_S6, T_S6 + 0.85));
      const beatShift = Math.sin(t * 1.5) * 3;

      fanCards[2].style.opacity = enter;
      fanCards[2].style.left = "140px";
      fanCards[2].style.top = "155px";
      fanCards[2].style.transform = `translateX(${lerp(-160, 0, enter)}px) rotateY(${10 + beatShift * 0.3}deg)`;
      fanCards[2].style.borderColor = "rgba(189, 147, 249, 0.78)";

      fanCards[3].style.opacity = enter;
      fanCards[3].style.left = "692px";
      fanCards[3].style.top = "155px";
      fanCards[3].style.transform = `translateX(${lerp(160, 0, enter)}px) rotateY(${-10 - beatShift * 0.3}deg)`;
      fanCards[3].style.borderColor = "rgba(69, 248, 130, 0.78)";

      setCaption(
        true,
        "E",
        "Effets & Export multi-formats",
        "Normaliser, fondus, vitesse/pitch et export propre en WAV, MP3, FLAC ou OGG."
      );
    } else {
      const baseT = T_S6 + BAR * 2;
      const gridPos = [
        { x: 168, y: 42,  ry: 8,  rx: 4,  color: "rgba(189, 147, 249, 0.72)" },
        { x: 664, y: 42,  ry: -8, rx: 4,  color: "rgba(69, 248, 130, 0.72)" },
        { x: 168, y: 344, ry: 8,  rx: -4, color: "rgba(139, 233, 253, 0.68)" },
        { x: 664, y: 344, ry: -8, rx: -4, color: "rgba(189, 147, 249, 0.58)" },
      ];
      fanCards.forEach((fc, i) => {
        const cardIn = easeOutCubic(norm(t, baseT + i * 0.45, baseT + 0.45 + i * 0.45));
        const pos = gridPos[i];
        fc.style.opacity = cardIn;
        fc.style.left = pos.x + "px";
        fc.style.top = pos.y + "px";
        fc.style.borderColor = pos.color;
        fc.style.transform = `scale(${lerp(0.86, 0.96, cardIn)}) rotateY(${pos.ry}deg) rotateX(${pos.rx}deg)`;
      });
      setCaption(true, "E", "Tout-en-un studio", "Du détecteur de BPM jusqu'à la boucle exportée à la milliseconde.");
    }
    return;
  }

  // ==============================================================
  // SCENE 7 (51.404s - 60.000s): FINAL IMPACT + OUTRO AUDIO TOOLZ
  // ==============================================================
  mainWin.style.opacity = 0;
  setCaption(false);

  const inFinal = easeOutCubic(norm(t, T_OUTRO, T_OUTRO + 0.75));
  const fadeOutEnd = t > 57.3 ? 1 - easeInOutCubic(norm(t, 57.3, 59.6)) : 1;

  brandScene.style.opacity = inFinal * fadeOutEnd;
  brandScene.style.transform = `scale(${lerp(1.12, 1.0, inFinal)})`;
  brandFlash.style.opacity = t < T_OUTRO + 0.38 ? clamp01(1 - (t - T_OUTRO) / 0.38) : 0;
  brandBadge.style.transform = "translateX(0) scale(1)";
  brandWordmark.style.clipPath = "inset(0 0 0 0)";
  brandWordmark.style.opacity = 1;

  brandTagline.textContent = "Détection BPM · Kicks aimantés · Boucles chirurgicales";
  brandTagline.style.opacity = easeOutCubic(norm(t, T_OUTRO + 0.5, T_OUTRO + 1.2));
  brandTagline.style.transform = `translateY(${lerp(10, 0, norm(t, T_OUTRO + 0.5, T_OUTRO + 1.2))}px)`;

  brandOutroMeta.style.opacity = easeOutCubic(norm(t, T_OUTRO + 1.4, T_OUTRO + 2.2));
};

window.renderFrame(0);
</script>
</body>
</html>
