name: Inspect uploaded Easter egg artwork
on:
  push:
    branches: [v1.6-dev]
    paths: ['.github/workflows/review-easter-art.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: easter-art-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/v1.6-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image reader
        run: python -m pip install Pillow==12.0.0
      - name: Prepare reduced review copies without changing the original
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          source = Path('src/features/easter-egg/333.png')
          data = source.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + bytes([0]) + data).hexdigest()
          if blob != '738be5b65e73616554503e423914d9f3e571389a':
              raise SystemExit('Artwork changed; inspect the new version before processing')
          folder = Path('.github/art-review')
          folder.mkdir(parents=True, exist_ok=True)
          with Image.open(source) as original:
              image = ImageOps.exif_transpose(original).convert('RGBA')
              alpha = image.getchannel('A')
              info = {'source': source.as_posix(), 'git_blob': blob, 'width': image.width, 'height': image.height, 'has_transparency': alpha.getextrema()[0] < 255, 'alpha_bbox': alpha.getbbox(), 'original_unchanged': True}
              image.thumbnail((384, 576), Image.Resampling.LANCZOS)
              checker = Image.new('RGB', image.size, '#cccccc')
              draw = ImageDraw.Draw(checker)
              for y in range(0, image.height, 12):
                  for x in range(0, image.width, 12):
                      if (x // 12 + y // 12) % 2:
                          draw.rectangle((x, y, x + 11, y + 11), fill='#999999')
              checker.paste(image, mask=image.getchannel('A'))
              checker.save(folder / '333-preview.jpg', quality=84, optimize=True)
              small = checker.copy()
              small.thumbnail((160, 240), Image.Resampling.LANCZOS)
              import io
              encoded = io.BytesIO()
              small.save(encoded, format='JPEG', quality=72, optimize=True)
              (folder / '333-preview.b64.txt').write_text(base64.b64encode(encoded.getvalue()).decode('ascii'), encoding='ascii')
          (folder / '333-info.json').write_text(json.dumps(info, indent=2) + chr(10), encoding='utf-8')
          if source.read_bytes() != data:
              raise SystemExit('Original artwork was modified')
          PY
      - name: Record only artwork review copies
        shell: bash
        run: |
          git add -- .github/art-review/333-preview.jpg .github/art-review/333-preview.b64.txt .github/art-review/333-info.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Prepare reduced Easter egg artwork review without altering original'
            git push origin HEAD:refs/heads/v1.6-dev
          fi
