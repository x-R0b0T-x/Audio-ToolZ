name: Version portable Windows 1.3
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier ou actualiser v1.3 en x64 uniquement (remplace l’ancien ZIP mixte)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compiler et empaqueter Windows x64
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - name: Conserver le ZIP et sa somme de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: Audio-ToolZ-1.3-Windows-Portable-x64
          path: |
            release-output/Audio-ToolZ-1.3-Windows-Portable-x64.zip
            release-output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publier ou actualiser la release 1.3
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Lecture des releases impossible.' }
          $existing = @($releases | Where-Object { $_.tag_name -eq 'v1.3' })
          if ($existing.Count -gt 0) {
            gh release upload v1.3 release-output/Audio-ToolZ-1.3-Windows-Portable-x64.zip release-output/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Téléversement en échec ; ancien ZIP conservé.' }
            gh release edit v1.3 --title 'Audio ToolZ 1.3 — Windows portable x64' --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Mise à jour des notes en échec.' }
            $assets = gh release view v1.3 --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Lecture des fichiers impossible.' }
            if (@($assets.assets | Where-Object { $_.name -eq 'Audio-ToolZ-1.3-Windows-Portable-x86-x64.zip' }).Count -gt 0) {
              gh release delete-asset v1.3 Audio-ToolZ-1.3-Windows-Portable-x86-x64.zip --yes
              if ($LASTEXITCODE -ne 0) { throw 'Suppression de l’ancien ZIP en échec.' }
            }
          } else {
            gh release create v1.3 release-output/Audio-ToolZ-1.3-Windows-Portable-x64.zip release-output/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title 'Audio ToolZ 1.3 — Windows portable x64' --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Publication en échec.' }
          }
