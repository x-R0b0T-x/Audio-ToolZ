name: Version portable Windows 1.3
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier la release 1.3 après compilation (sinon : artefact de test uniquement)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compiler et empaqueter les deux architectures
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - name: Conserver le ZIP et sa somme de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: Audio-ToolZ-1.3-Windows-Portable
          path: |
            release-output/Audio-ToolZ-1.3-Windows-Portable-x86-x64.zip
            release-output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publier la release 1.3
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3 release-output/Audio-ToolZ-1.3-Windows-Portable-x86-x64.zip release-output/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title 'Audio ToolZ 1.3 — Windows portable x86 et x64' --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Publication de la release en échec.' }
