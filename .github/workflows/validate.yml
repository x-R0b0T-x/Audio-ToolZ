name: Audio ToolZ - Windows validation
on:
  push:
    branches: [main]
    paths: ['src/**','src-tauri/**','public/**','package.json','package-lock.json','vite.config.ts','tsconfig.json','index.html','.github/cleanup.py','.github/workflows/validate.yml','.github/release/package_v17.py','.github/maintenance/verify_pitcher_runtime.mjs']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-toolz-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'x-R0b0T-x/Audio-ToolZ'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Remove only reviewed obsolete files without remaining references
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python .github/cleanup.py
      - name: Install locked application dependencies and validation tools
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked installation failed' }
          npm install --no-save @tauri-apps/cli@2 playwright
          if ($LASTEXITCODE -ne 0) { throw 'Validation tool installation failed' }
      - name: Source audit
        run: node src/utils/reviewAudit.mjs
      - name: All Node regression tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem src -Recurse -Filter '*.test.mjs' | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'No regression tests' }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: TypeScript check
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Signalsmith runtime validation under application CSP
        timeout-minutes: 10
        run: node .github/maintenance/verify_pitcher_runtime.mjs
      - name: Rust decoder and configuration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: Windows executable build
        run: npx tauri build --no-bundle
      - name: Verify ZIP packaging and Windows Shell extraction
        run: python .github/release/package_v17.py
      - name: Upload rebuilt validation ZIP without publishing a release
        uses: actions/upload-artifact@v4
        with:
          name: Audio.ToolZ.validation.windows
          path: single-output/*.zip
          if-no-files-found: error
      - name: Record cleanup only after complete validation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected checkout' }
          @'
          import json
          from pathlib import Path
          p=Path('.github/diagnostics/repository-cleanup-2.json')
          if p.exists():
              report=json.loads(p.read_text(encoding='utf-8'))
              if report['validation']=='pending':
                  report['validation']='node-typescript-frontend-signalsmith-runtime-rust-windows-build-and-shell-extraction-passed'
                  p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup report failed' }
          git add -- .github/diagnostics/repository-cleanup-2.json
          if ($LASTEXITCODE -ne 0) { throw 'Report staging failed' }
          git diff --cached --quiet
          $result = $LASTEXITCODE
          if ($result -gt 1) { throw 'Diff failed' }
          if ($result -eq 1) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove verified obsolete repository files'
            if ($LASTEXITCODE -ne 0) { throw 'Cleanup commit failed' }
            git push origin HEAD:refs/heads/main
            if ($LASTEXITCODE -ne 0) { throw 'Cleanup push rejected; no newer changes overwritten' }
          }
          exit 0
      - name: Upload audit and cleanup reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Audio.ToolZ.validation.reports
          path: |
            audit-output/
            .github/diagnostics/repository-cleanup.json
            .github/diagnostics/repository-cleanup-2.json
          if-no-files-found: warn
