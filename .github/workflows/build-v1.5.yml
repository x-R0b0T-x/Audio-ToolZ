name: Audio ToolZ v1.5 - Test Build Portable (Tauri v2)

on:
  push:
    branches: [main, 'v1.5*']
    paths: ['.github/workflows/build-v1.5.yml', 'src/**', 'src-tauri/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Recuperer les icones depuis l'historique du depot
        shell: pwsh
        run: |
          git restore --source=6af5c11 -- public/icon.ico public/icon.png
          if ($LASTEXITCODE -ne 0) { throw 'Icones introuvables' }

      - name: Installer les dependances frontend et Tauri CLI
        run: |
          npm install
          npm install --no-save @tauri-apps/cli@2

      - name: Compiler Audio ToolZ.exe sans Electron (~8-12 Mo)
        run: npx tauri build --no-bundle

      - name: Empaqueter Audio ToolZ Portable v1.5 ZIP (test)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-output/Audio ToolZ" | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" | Where-Object { $_.Name -match "audio.?toolz" } | Select-Object -First 1
          if (-not $exe) { throw "Executable Tauri introuvable" }
          Copy-Item $exe.FullName "release-output/Audio ToolZ/Audio ToolZ.exe"
          Compress-Archive -Path "release-output/Audio ToolZ" -DestinationPath "release-output/Audio-ToolZ-1.5-Windows-Portable-x64.zip" -Force
          $hash = (Get-FileHash "release-output/Audio-ToolZ-1.5-Windows-Portable-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Audio-ToolZ-1.5-Windows-Portable-x64.zip" | Out-File -Encoding ascii "release-output/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: Audio-ToolZ-v1.5-Test-Windows-x64
          path: |
            release-output/Audio-ToolZ-1.5-Windows-Portable-x64.zip
            release-output/SHA256SUMS.txt
          if-no-files-found: error
