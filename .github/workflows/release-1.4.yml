name: Publication officielle Audio ToolZ v1.4
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.4.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-toolz-release-1.4
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verifier le correctif valide et actualiser le changelog
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/.v1.4-applied
          test -f scripts/.v1.4-autozoom-applied
          node scripts/test-1.4.cjs
          node scripts/test-1.4-navigation.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const file = 'src/components/InfoModal.tsx';
          let text = fs.readFileSync(file, 'utf8');
          const notes = [
            'Lecture depuis le curseur ; clic gauche pour le début, clic droit pour la fin de la sélection.',
            'Une boucle en cours reste active quand une borne valide est ajustée.',
            'Forme d’onde visible pendant le déplacement des bornes, avec dézoom progressif et limité hors de la vue.'
          ];
          const old = 'Bouton Lecture démarrant au début de la piste et Boucle dédiée à la sélection';
          if (!text.includes(notes[0])) {
            assert.ok(text.includes(old));
            text = text.replace(JSON.stringify(old).replace(/^"|"$/g, ''), () => notes.join("',\n  '"));
            text = text.replace('Départ de lecture', 'Départ de lecture / début de sélection');
            text = text.replace('Créer la sélection / boucle', 'Définir la fin de sélection');
            fs.writeFileSync(file, text);
          }
          for (const file of ['RELEASE_NOTES_1.4.md', 'CHANGELOG.md']) {
            const body = fs.readFileSync(file, 'utf8');
            if (!body.includes(notes[0])) fs.writeFileSync(file, '## Navigation et boucles — v1.4\n\n' + notes.map(note => '- ' + note).join('\n') + '\n\n' + body);
          }
          NODE
      - name: Compiler et preparer le ZIP Windows x64
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Audio-ToolZ-1.4-Windows-Portable-x64
          path: |
            release-output/Audio-ToolZ-1.4-Windows-Portable-x64.zip
            release-output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Enregistrer les sources compilees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/InfoModal.tsx src/utils/useWaveformInteractions.ts CHANGELOG.md RELEASE_NOTES_1.4.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: finaliser le changelog de la v1.4'
            git push origin HEAD:main
          fi
      - name: Publier la release v1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-1.4.cjs
