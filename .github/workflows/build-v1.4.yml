name: Audio ToolZ v1.4 - Compilation officielle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v1.4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Recuperer les fichiers de compilation et les icones
        shell: pwsh
        run: |
          git restore --source=abb055931dc8320528dc9ea6538526d0e70eb4d3 -- scripts/build-portable.ps1 scripts/set-exe-icon.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Scripts de compilation introuvables' }
          git restore --source=6af5c11 -- public/icon.ico public/icon.png
          if ($LASTEXITCODE -ne 0) { throw 'Icones introuvables' }
      - name: Compiler le ZIP portable Windows x64
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Audio-ToolZ-v1.4-Windows-x64
          path: |
            release-output/Audio-ToolZ-1.4-Windows-Portable-x64.zip
            release-output/SHA256SUMS.txt
          if-no-files-found: error
