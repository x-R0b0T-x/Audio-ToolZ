name: Audio ToolZ v1.6 dev - Windows portable
on:
  push:
    branches: [v1.6-dev]
    paths: ['src/**', 'src-tauri/**', 'package.json', '.gitattributes', '.github/scripts/**', '.github/workflows/build-v1.6.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-v16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/v1.6-dev'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Organize and connect original Easter egg media
        run: python .github/scripts/organize-easter-egg.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore application icons
        shell: pwsh
        run: |
          if (-not (Test-Path public/icon.ico) -or -not (Test-Path public/icon.png)) {
            git restore --source=6af5c11 -- public/icon.ico public/icon.png
            if ($LASTEXITCODE -ne 0) { throw 'Icons unavailable' }
          }
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @tauri-apps/cli@2
      - name: Preview, gesture, click and media lifecycle tests
        run: node --test src/audio/effectsIntegration.test.mjs src/utils/eqGestures.test.mjs src/features/easter-egg/clickCounter.test.mjs src/features/easter-egg/mediaPlayback.test.mjs
      - name: DSP and effect UI regression tests
        run: npx tsx --test src/audio/advancedDsp.test.ts src/audio/effectsIntegration.test.ts src/utils/controlWheel.test.ts src/components/effectUiMath.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Build portable application
        run: npx tauri build --no-bundle
      - name: Verify original media are included in the frontend bundle
        shell: pwsh
        run: |
          foreach ($item in @(@('robot','mp4'),@('music','ogg'))) {
            $name = $item[0]; $ext = $item[1]
            $source = "src/features/easter-egg/assets/$name.$ext"
            $bundled = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Name -like "$name-*.$ext" })
            if ($bundled.Count -ne 1) { throw "Bundled media unavailable: $name" }
            if ((Get-FileHash $source -Algorithm SHA256).Hash -ne (Get-FileHash $bundled[0].FullName -Algorithm SHA256).Hash) { throw "Bundled media changed: $name" }
          }
      - name: Prepare test executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/*.exe | Where-Object { $_.Name -match 'audio.?toolz' } | Select-Object -First 1
          if (-not $exe) { throw 'Executable unavailable' }
          Copy-Item $exe.FullName 'release-output/Audio ToolZ 1.6 dev.exe'
          $hash = (Get-FileHash 'release-output/Audio ToolZ 1.6 dev.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Audio ToolZ 1.6 dev.exe" | Out-File -Encoding ascii release-output/SHA256SUMS.txt
      - name: Commit only validated organized sources and media
        shell: pwsh
        run: |
          git add -A -- src .github .gitattributes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage organized sources' }
          foreach ($name in @('x.mp4','x.ogg')) {
            $tracked = git ls-files -- $name
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect source media' }
            if ($tracked) {
              git add -u -- $name
              if ($LASTEXITCODE -ne 0) { throw 'Unable to stage media relocation' }
            }
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Organize Easter egg feature and integrate original video and OGG'
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
            git push origin HEAD:refs/heads/v1.6-dev
            if ($LASTEXITCODE -ne 0) { throw 'Branch changed; refusing to overwrite it' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Unable to check staged changes' }
      - uses: actions/upload-artifact@v5
        with:
          name: Audio-ToolZ-v1.6-dev-Windows-x64
          path: release-output/*
          if-no-files-found: error
