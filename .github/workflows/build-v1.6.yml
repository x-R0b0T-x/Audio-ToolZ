name: Audio ToolZ v1.6 dev - Windows portable
on:
  push:
    branches: [v1.6-dev]
    paths: ['src/**', 'src-tauri/**', 'package.json', '.gitattributes', '.github/scripts/**', '.github/workflows/build-v1.6.yml', 'RELEASE_NOTES_1.6.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-v16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/v1.6-dev'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare clean 1.6 candidate from finalized sources
        run: python .github/scripts/prepare-clean-16.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PNG validator
        run: python -m pip install Pillow==12.0.0
      - name: Restore application icons
        shell: pwsh
        run: |
          if (-not (Test-Path public/icon.ico) -or -not (Test-Path public/icon.png)) {
            git restore --source=6af5c11 -- public/icon.ico public/icon.png
            if ($LASTEXITCODE -ne 0) { throw 'Icons unavailable' }
          }
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @tauri-apps/cli@2
      - name: Validate artwork without generating unused sources
        run: python .github/scripts/verify-about-ring.py
      - name: Preview, gesture, click and native loop tests
        run: node --test src/audio/effectsIntegration.test.mjs src/utils/eqGestures.test.mjs src/features/q7m4n2/clickCounter.test.mjs src/audio/bufferLoop.test.mjs src/components/aboutLight.test.mjs src/utils/finalUi.test.mjs
      - name: DSP, navigation, routing and final cleanup tests
        run: npx tsx --test src/audio/advancedDsp.test.ts src/audio/limiterCeiling.test.ts src/audio/controlPolish.test.ts src/audio/effectsIntegration.test.ts src/utils/controlWheel.test.ts src/components/effectUiMath.test.ts src/utils/overviewNavigation.test.ts src/audio/musicalDelayRouting.test.ts src/utils/finalCleanup.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Build portable application
        run: npx tauri build --no-bundle
      - name: Audit packaged files and verify media integrity
        shell: pwsh
        run: |
          $unwanted = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Name -match '\.(map|tsx?|test\.mjs|py|md)$' })
          if ($unwanted.Count -gt 0) { throw 'Development files found in production assets' }
          $media = @(@{source='src/features/q7m4n2/333.png';pattern='333-*.png'},@{source='src/features/q7m4n2/assets/music.ogg';pattern='music-*.ogg'})
          foreach ($item in $media) {
            $bundled = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Name -like $item.pattern })
            if ($bundled.Count -ne 1) { throw "Bundled media unavailable: $($item.source)" }
            if ((Get-FileHash $item.source -Algorithm SHA256).Hash -ne (Get-FileHash $bundled[0].FullName -Algorithm SHA256).Hash) { throw 'Bundled media changed' }
          }
      - name: Prepare candidate executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/*.exe | Where-Object { $_.Name -match 'audio.?toolz' } | Select-Object -First 1
          if (-not $exe) { throw 'Executable unavailable' }
          Copy-Item $exe.FullName 'release-output/Audio ToolZ.exe'
          $hash = (Get-FileHash 'release-output/Audio ToolZ.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Audio ToolZ.exe" | Out-File -Encoding ascii release-output/SHA256SUMS.txt
          Write-Output "Executable size: $($exe.Length) bytes"
      - uses: actions/upload-artifact@v5
        with:
          name: Audio-ToolZ-v1.6-Windows-x64-candidate
          path: release-output/*
          if-no-files-found: error
      - name: Commit only validated cleaned sources and release metadata
        shell: pwsh
        run: |
          git add -A -- src src-tauri package.json CHANGELOG.md RELEASE_NOTES_1.6.md .github
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage sources' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Validate clean Audio ToolZ 1.6 candidate'
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
            git push origin HEAD:refs/heads/v1.6-dev
            if ($LASTEXITCODE -ne 0) { throw 'Branch advanced; sources were not overwritten' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Unable to check staged sources' }
