name: Audio ToolZ v1.7-dev - Windows validation
on:
  push:
    branches: [v.1.7-dev]
    paths: ['src/**', 'src-tauri/**', 'package.json', '.github/workflows/build-v1.7-dev.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reverb-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/v.1.7-dev'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit tracked source and robot spelling
        run: node src/utils/reviewAudit.mjs
      - name: Upload source review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Audio.ToolZ.v1.7-dev.source-audit
          path: audit-output/
          if-no-files-found: warn
      - name: Restore application icons if missing
        shell: pwsh
        run: |
          if (-not (Test-Path public/icon.ico) -or -not (Test-Path public/icon.png)) {
            git restore --source=6af5c11 -- public/icon.ico public/icon.png
            if ($LASTEXITCODE -ne 0) { throw 'Icons unavailable' }
          }
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @tauri-apps/cli@2
      - name: Resolve and verify Symphonia 0.6.1
        shell: pwsh
        run: |
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo dependency resolution failed' }
          $symphonia = @($metadata.packages | Where-Object { $_.name -eq 'symphonia' })
          if ($symphonia.Count -ne 1 -or $symphonia[0].version -ne '0.6.1') { throw 'Expected exactly Symphonia 0.6.1' }
      - name: Build frontend assets for Rust application tests
        run: npm run build
      - name: Symphonia decoder regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml audio_fallback::tests -- --nocapture
      - name: Audio UI and global transport regression tests
        run: node --test src/audio/reverb.test.mjs src/audio/reverbRefinements.test.mjs src/utils/headerWaveMath.test.mjs src/components/devBuildCorrections.test.mjs src/utils/spaceTransport.test.mjs
      - name: TypeScript check
        run: npm run lint
      - name: Build portable Windows application
        run: npx tauri build --no-bundle
      - name: Prepare and verify portable folder
        shell: pwsh
        run: |
          $folder = 'dev-output/Audio ToolZ'
          New-Item -ItemType Directory -Force "$folder/validation" | Out-Null
          Copy-Item src-tauri/target/release/audio-toolz.exe "$folder/Audio ToolZ.exe"
          Copy-Item src/medias/logo.ico "$folder/Audio ToolZ.ico"
          @('[.ShellClassInfo]', 'IconResource=Audio ToolZ.ico,0') | Set-Content "$folder/Desktop.ini" -Encoding Unicode
          attrib +h +s "$folder/Desktop.ini"
          attrib +r "$folder"
          Copy-Item src-tauri/Cargo.lock "$folder/validation/Cargo.lock"
          Copy-Item audit-output/review-audit.json "$folder/validation/review-audit.json"
          @('Audio ToolZ v1.7-dev - development build', 'Source commit: ${{ github.sha }}', 'Symphonia 0.6.1 verified by cargo metadata.', 'Automated tests and TypeScript validation passed before packaging.', 'Visual Windows behavior still requires manual validation.') | Set-Content "$folder/BUILD.txt"
          Get-FileHash "$folder/Audio ToolZ.exe" -Algorithm SHA256 | Format-List | Out-File "$folder/validation/SHA256.txt"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP 'Audio-ToolZ-portable-check.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path dev-output).Path, $zip)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('Audio ToolZ/Audio ToolZ.exe','Audio ToolZ/Audio ToolZ.ico','Audio ToolZ/Desktop.ini')) {
              if ($names -notcontains $required) { throw "Missing portable entry: $required" }
            }
            if (@($names | Where-Object { $_ -notlike 'Audio ToolZ/*' }).Count) { throw 'Unexpected entry outside Audio ToolZ/' }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: Audio.ToolZ.v1.7-dev
          path: dev-output/
          include-hidden-files: true
          if-no-files-found: error
