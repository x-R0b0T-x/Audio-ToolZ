name: Audio ToolZ v1.7-dev - Windows validation
on:
  push:
    branches: [v.1.7-dev]
    paths: ['src/**', 'src-tauri/**', 'public/third_party/bpm/**', 'package.json', '.github/maintenance/**', '.github/workflows/build-v1.7-dev.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reverb-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'x-R0b0T-x/Audio-ToolZ' && github.ref == 'refs/heads/v.1.7-dev'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v.1.7-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare reviewed development sources and BPM integration
        shell: pwsh
        run: |
          python .github/maintenance/finish_v17.py
          if ($LASTEXITCODE -ne 0) { throw 'Finishing failed' }
          python .github/maintenance/add_bpm_comparison.py
          if ($LASTEXITCODE -ne 0) { throw 'BPM integration failed' }
          git add -A -- src package.json .github/maintenance/package-v17.py .github/diagnostics/finishing-v17.json .github/diagnostics/bpm-comparison.json
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
      - name: Restore application icons if missing
        shell: pwsh
        run: |
          if (-not (Test-Path public/icon.ico) -or -not (Test-Path public/icon.png)) {
            git restore --source=6af5c11 -- public/icon.ico public/icon.png
            if ($LASTEXITCODE -ne 0) { throw 'Icons unavailable' }
          }
      - name: Install frontend and build dependencies
        shell: pwsh
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm install --no-save @tauri-apps/cli@2
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed' }
      - name: Vendor exact BPM runtimes, licenses and corresponding sources
        run: python .github/maintenance/vendor_bpm.py
      - name: Apply complete user interface review
        shell: pwsh
        run: |
          python .github/maintenance/review_v17.py
          if ($LASTEXITCODE -ne 0) { throw 'User interface review failed' }
          git add -A -- src .github/diagnostics/review-v17.json
          if ($LASTEXITCODE -ne 0) { throw 'Review staging failed' }
      - name: Audit all tracked corrected source
        run: node src/utils/reviewAudit.mjs
      - name: Verify locked Symphonia 0.6.1
        shell: pwsh
        run: |
          $raw = & cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo resolution failed' }
          $metadata = $raw | ConvertFrom-Json
          $symphonia = @($metadata.packages | Where-Object { $_.name -eq 'symphonia' })
          if ($symphonia.Count -ne 1 -or $symphonia[0].version -ne '0.6.1') { throw 'Expected exactly Symphonia 0.6.1' }
          $raw | Set-Content audit-output/locked-metadata.json -Encoding utf8
      - name: All source Node regression tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem src -Recurse -Filter '*.test.mjs' | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'No regression tests found' }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: TypeScript check
        run: npm run lint
      - name: Build frontend assets for Rust tests
        run: npm run build
      - name: Execute all three real BPM engines with offline networking and application CSP
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          $server = Start-Process node -ArgumentList @('node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4178','--strictPort') -PassThru -RedirectStandardOutput audit-output/bpm-preview.log -RedirectStandardError audit-output/bpm-preview-error.log
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              try { $response=Invoke-WebRequest http://127.0.0.1:4178/ -TimeoutSec 2; if ($response.StatusCode -eq 200) { $ready=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Compiled frontend unavailable' }
            node src/audio/bpmCompare.browser.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Actual BPM engine smoke test failed' }
          } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
      - name: Symphonia decoder regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml audio_fallback::tests -- --nocapture
      - name: Build portable Windows application
        run: npx tauri build --no-bundle
      - name: Record only tested development sources locally
        shell: pwsh
        run: |
          if ((git branch --show-current) -ne 'v.1.7-dev') { throw 'Wrong branch' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected checkout' }
          git diff --exit-code -- src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Rust lock changed unexpectedly' }
          @'
          import json
          from pathlib import Path
          for name in ['finishing-v17.json','review-v17.json','bpm-comparison.json']:
              path=Path('.github/diagnostics')/name
              report=json.loads(path.read_text(encoding='utf-8'))
              report['validation']='node-tests-typescript-frontend-offline-three-engine-smoke-decoder-tests-and-windows-build-passed'
              path.write_bytes((json.dumps(report,ensure_ascii=False,indent=2)+'\n').encode('utf-8'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot update reports' }
          git add -- .github/diagnostics/finishing-v17.json .github/diagnostics/review-v17.json .github/diagnostics/bpm-comparison.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage reports' }
          git diff --cached --quiet
          $result = $LASTEXITCODE
          if ($result -gt 1) { throw 'Cannot inspect staged changes' }
          if ($result -eq 1) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: validate BPM engine comparison on v1.7-dev'
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          }
          exit 0
      - name: Package and verify Windows Shell extraction
        run: python .github/maintenance/package-v17.py
      - name: Publish validated development sources without force
        shell: pwsh
        run: |
          git push origin HEAD:refs/heads/v.1.7-dev
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; newer changes were not overwritten' }
      - name: Upload corresponding BPM and application sources
        uses: actions/upload-artifact@v4
        with:
          name: Audio.ToolZ.v1.7-dev.BPM-sources
          path: bpm-source-output/Audio.ToolZ.BPM.sources.zip
          if-no-files-found: error
      - name: Upload exact portable ZIP without wrapping
        uses: actions/upload-artifact@v7
        with:
          path: single-output/Audio ToolZ v1.7-dev.zip
          archive: false
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Audio.ToolZ.v1.7-dev.validation
          path: |
            audit-output/
            .github/diagnostics/finishing-v17.json
            .github/diagnostics/review-v17.json
            .github/diagnostics/bpm-comparison.json
          if-no-files-found: warn
