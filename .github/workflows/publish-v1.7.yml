name: Publier Audio ToolZ v1.7 officielle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.7.yml']
permissions:
  actions: read
  contents: write
concurrency: audio-toolz-publish-v1.7
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 459d82961fff1fa8ba36c6b1fbcbb17f36363875
      BUILD_SHA: cd2da899482dc015c545a8354ec29a5699fd7419
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verifier le candidat valide et publier le ZIP teste
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE" HEAD
          git show "$SOURCE:.github/diagnostics/official-v17.json" > official.json
          jq -e '.version == "1.7.0" and .validation == "node-typescript-frontend-signalsmith-runtime-rust-and-windows-build-passed"' official.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-v1.7.yml/runs?head_sha=$BUILD_SHA&status=success&per_page=20" > runs.json
          RUN_ID="$(jq -r '[.workflow_runs[] | select(.conclusion == "success" and .head_sha == env.BUILD_SHA and .head_branch == "v.1.7-dev")][0].id // empty' runs.json)"
          test -n "$RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=Audio.ToolZ.v1.7.official" > artifacts.json
          test "$(jq '[.artifacts[] | select(.name == "Audio.ToolZ.v1.7.official" and .expired == false)] | length' artifacts.json)" = 1
          ARTIFACT_ID="$(jq -r '[.artifacts[] | select(.name == "Audio.ToolZ.v1.7.official" and .expired == false)][0].id' artifacts.json)"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          test "$(jq '[.[] | select(.tag_name == "v1.7")] | length' releases.json)" = 0
          if git ls-remote --exit-code --tags origin refs/tags/v1.7 >/dev/null 2>&1; then
            echo 'Le tag v1.7 existe deja : arret sans modification.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          mkdir package
          unzip -q artifact.zip -d package
          cd package
          test -s 'Audio ToolZ v1.7.zip'
          test -s SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          python3 - <<'PY'
          import zipfile
          archive = zipfile.ZipFile('Audio ToolZ v1.7.zip')
          attrs = {
              'Audio ToolZ/': 0x15,
              'Audio ToolZ/Audio ToolZ.exe': 0x20,
              'Audio ToolZ/Audio ToolZ.ico': 0x22,
              'Audio ToolZ/Desktop.ini': 0x27,
          }
          assert set(archive.namelist()) == set(attrs), archive.namelist()
          assert archive.testzip() is None
          for name, expected in attrs.items():
              assert archive.getinfo(name).external_attr & 0xff == expected, name
          assert archive.read('Audio ToolZ/Audio ToolZ.exe')[:2] == b'MZ'
          ini = archive.read('Audio ToolZ/Desktop.ini').decode('utf-16')
          assert 'LocalizedResourceName=Audio ToolZ' in ini and 'IconResource=Audio ToolZ.ico,0' in ini
          PY
          cd ..
          test -s .github/release/notes-v1.7.md
          gh release create v1.7 'package/Audio ToolZ v1.7.zip' package/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title 'Audio ToolZ v1.7' --notes-file .github/release/notes-v1.7.md --draft
          gh release edit v1.7 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
