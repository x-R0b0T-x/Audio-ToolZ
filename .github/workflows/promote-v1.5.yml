name: Promouvoir Audio ToolZ v1.5 officielle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-v1.5.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restaurer les icônes, vérifier et promouvoir
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v1.5-test archive/main-avant-v1.5
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 92f9e49a4b4dbe7390a76a6a986724437b86d379
          test "$(git rev-parse origin/archive/main-avant-v1.5)" = 7f9df0f141c2474cd83752d0c6fea0ec81a643fb
          SOURCE=59d37c766387227833ef84321a6e4ed684ff092a
          test "$(git rev-parse origin/v1.5-test)" = "$SOURCE"
          git read-tree --reset -u "$SOURCE"
          git restore --source=6af5c11 --staged --worktree -- public/icon.ico public/icon.png
          test -s public/icon.ico
          test -s public/icon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-v1.5.yml')
          s = p.read_text()
          s = s.replace('Audio ToolZ v1.5 - Test Build Portable (Tauri v2)', 'Audio ToolZ v1.5 - Compilation officielle (Tauri v2)')
          s = s.replace('Audio-ToolZ-v1.5-Test-Windows-x64', 'Audio-ToolZ-v1.5-Windows-x64')
          p.write_text(s)
          PY
          npm install
          npm run lint
          npm run build
          git add .github/workflows/build-v1.5.yml
          TREE=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COMMIT=$(printf '%s\n' 'Audio ToolZ v1.5 officielle — Tauri et icônes intégrées' | git commit-tree "$TREE" -p "$GITHUB_SHA" -p "$SOURCE")
          git push origin "$COMMIT:refs/heads/main"
